<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vibe Coding 页面作品集</title>
  <meta name="description" content="整理自多个 vibe coding 页面样例的网页项目索引，便于在 GitHub Pages 上浏览与归档。">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero__glow hero__glow--one"></div>
    <div class="hero__glow hero__glow--two"></div>
    <nav class="topbar" aria-label="页面导航">
      <a class="brand" href="./index.html">Vibe Pages</a>
      <a href="#projects">作品目录</a>
      <a href="https://github.com/caixiang2005/vibe-coding-pages" target="_blank" rel="noreferrer">GitHub</a>
    </nav>
    <section class="hero__content">
      <p class="eyebrow">Curated Web UI Archive</p>
      <h1>Vibe Coding 页面作品集</h1>
      <p class="hero__lead">收录业务系统、数据看板与交互原型。每个作品均保留原始页面入口，方便浏览设计与体验交互。</p>
      <div class="hero__actions">
        <a class="button button--primary" href="#projects">浏览全部作品</a>
        <a class="button button--ghost" href="https://github.com/caixiang2005/vibe-coding-pages" target="_blank" rel="noreferrer">GitHub 仓库</a>
      </div>
    </section>
    <section class="stats" aria-label="项目统计">
      <article><strong id="totalProjects">39</strong><span>整理作品</span></article>
      <article><strong id="totalPages">0</strong><span>HTML 页面</span></article>
      <article><strong id="screenshotProjects">0</strong><span>含截图目录</span></article>
      <article><strong>GitHub</strong><span>Pages Ready</span></article>
    </section>
  </header>

  <main>
    <section class="toolbar" aria-label="筛选工具" id="projects">
      <div>
        <p class="section-kicker">Projects</p>
        <h2>作品目录</h2>
      </div>
      <div class="filters">
        <label class="search">
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="输入项目名、slug、模块关键词...">
        </label>
        <label class="select">
          <span>筛选</span>
          <select id="screenshotFilter">
            <option value="all">全部项目</option>
            <option value="with">含截图目录</option>
            <option value="without">无截图目录</option>
          </select>
        </label>
      </div>
    </section>

    <section class="grid" id="projectGrid" aria-live="polite"></section>
  </main>

  <footer class="footer">
    <p>整理方式：保留原始目录，新增统一索引与 README，适合直接推送到 GitHub 仓库并开启 GitHub Pages。</p>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
